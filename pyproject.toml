[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "automerge"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
version = "0.2.0.dev4"

# Optional dependencies for additional features
# Install with: pip install automerge[websocket]
# Or all extras: pip install automerge[all]
[project.optional-dependencies]
websocket = [
    "websockets>=16.0",
]
s3 = [
    "aiobotocore>=3.7.0",
]
all = [
    "websockets>=16.0",
    "aiobotocore>=3.7.0",
]

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py310"]
module-name = "automerge._automerge"

[tool.pytest.ini_options]

[tool.ruff.lint]
# Preserve the original default rules instead of expanding checks on upgrade.
select = ["E4", "E7", "E9", "F"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "moto[server]>=5.0.0",
]
